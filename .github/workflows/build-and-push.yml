name: Publish tested Docker images

on:
  workflow_call:
    inputs:
      backend_service:
        description: Whether the backend image needs publishing
        required: true
        type: boolean
      frontend_service:
        description: Whether the frontend image needs publishing
        required: true
        type: boolean
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  backend_service:
    name: Publish backend
    if: inputs.backend_service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/images
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push the image already tested in CI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker load -i /tmp/images/backend-image.tar
          IMAGE="$DOCKER_USERNAME/jobmatch.backend"
          docker tag jobmatch-backend:tested "$IMAGE:$GITHUB_SHA"
          docker tag jobmatch-backend:tested "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  frontend_service:
    name: Publish frontend
    if: inputs.frontend_service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/images
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push the image already tested in CI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker load -i /tmp/images/frontend-image.tar
          IMAGE="$DOCKER_USERNAME/jobmatch.frontend"
          docker tag jobmatch-frontend:tested "$IMAGE:$GITHUB_SHA"
          docker tag jobmatch-frontend:tested "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
