name: Linters

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Check Python
        run: |
          black --check --config backend/pyproject.toml backend tests/e2e
          isort --check-only --settings-path backend/pyproject.toml backend tests/e2e
          flake8 --config backend/.flake8 backend tests/e2e
      - name: Check JavaScript and formatting
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend run lint
